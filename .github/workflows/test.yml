name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: sudo -E swift test
        env:
          DEPLOYMENT_ENVIRONMENT: ci
          VERSION: ${{ github.sha }}
